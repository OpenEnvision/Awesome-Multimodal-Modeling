<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" fill="none">
  <title>MLLMs: perceptual evidence conditions a pretrained language backbone</title>
  <desc>Text is tokenized and embedded. Visual features pass through a modality interface. Depending on the model, this supplies input tokens, for example with a projector or Q-Former, or conditions language layers through cross-attention. The dashed route is an alternative, not an additional stage required in every MLLM.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#62656b" stroke-width="1.3"/></marker>
    <marker id="red-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#ce352c" stroke-width="1.3"/></marker>
  </defs>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="68" y="20" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Text</text><text x="225" y="20" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Image</text><path d="M68 27v17" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M225 27v17" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="10" y="47" width="116" height="42" rx="3" fill="white" stroke="#c9ccd0" stroke-width="1.3"/><text x="68" y="64" font-size="12.5" fill="#171717" font-weight="400" text-anchor="middle">Text tokenizer</text><text x="68" y="80" font-size="11.5" fill="#62656b" font-weight="400" text-anchor="middle">+ embeddings</text><rect x="160" y="47" width="130" height="42" rx="3" fill="white" stroke="#171717" stroke-width="1.3"/><text x="225" y="64" font-size="13" fill="#171717" font-weight="400" text-anchor="middle">Vision encoder</text><text x="225" y="80" font-size="11.5" fill="#62656b" font-weight="400" text-anchor="middle">often pretrained</text><path d="M225 89v16" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="144" y="108" width="146" height="65" rx="3" fill="#fcf0ee" stroke="#ce352c" stroke-width="1.3"/><text x="217" y="128" font-size="13" fill="#ce352c" font-weight="600" text-anchor="middle">Modality interface</text><text x="217" y="146" font-size="11.5" fill="#62656b" font-weight="400" text-anchor="middle">Projector / Q-Former</text><text x="217" y="163" font-size="11.5" fill="#62656b" font-weight="400" text-anchor="middle">or cross-attention</text><path d="M68 89v126" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M196 173v23h-40v19" fill="none" stroke="#ce352c" stroke-width="1.35" marker-end="url(#red-arrow)"/><text x="174" y="191" font-size="11" fill="#ce352c" font-weight="400" text-anchor="middle">input</text><path d="M265 173h32v100h-15" fill="none" stroke="#ce352c" stroke-width="1.35" marker-end="url(#red-arrow)" stroke-dasharray="4 3"/><text x="293" y="209" font-size="11" fill="#ce352c" font-weight="400" text-anchor="end">or</text><rect x="18" y="218" width="264" height="99" rx="3" fill="white" stroke="#171717" stroke-width="1.3"/><text x="150" y="240" font-size="16" fill="#171717" font-weight="600" text-anchor="middle">Pretrained LLM</text><text x="150" y="257" font-size="11.5" fill="#62656b" font-weight="400" text-anchor="middle">language-centered backbone</text><rect x="37" y="267" width="227" height="32" rx="3" fill="#f8f8f8" stroke="#c9ccd0" stroke-width="1.3"/><text x="150" y="288" font-size="13" fill="#171717" font-weight="400" text-anchor="middle">Transformer layers</text><path d="M150 317v19" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><text x="150" y="355" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Text response</text>
  </g>
</svg>
