<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" fill="none">
  <title>NMMs: architecture and training are distinct dimensions</title>
  <desc>The illustrated early-fusion pattern packs modality-specific interface outputs before the first shared backbone block. Separate text tokenizers and image interfaces can remain. Core states then interact across modalities. Nativity also requires reporting when multimodal objectives enter training and which core parameters they optimize. Early fusion alone does not establish training from scratch. Mid and late fusion require their own training qualification; generation is optional in this list.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#62656b" stroke-width="1.3"/></marker>
    <marker id="red-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#ce352c" stroke-width="1.3"/></marker>
  </defs>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="8" y="13" font-size="11" fill="#62656b" font-weight="600" text-anchor="start">EARLY-FUSION EXAMPLE</text><text x="68" y="39" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Text</text><text x="224" y="39" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Image</text><path d="M68 46v10" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M224 46v10" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="10" y="59" width="116" height="43" rx="3" fill="white" stroke="#c9ccd0" stroke-width="1.3"/><text x="68" y="85" font-size="12.5" fill="#171717" font-weight="400" text-anchor="middle">Text tokenizer</text><rect x="152" y="59" width="144" height="43" rx="3" fill="white" stroke="#c9ccd0" stroke-width="1.3"/><text x="224" y="77" font-size="13" fill="#171717" font-weight="400" text-anchor="middle">Image interface</text><text x="224" y="94" font-size="10.5" fill="#62656b" font-weight="400" text-anchor="middle">tokens / latents / patches</text><path d="M68 102v15h57v10" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M224 102v15h-50v10" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="111" y="131" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="124" y="131" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="137" y="131" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="153" y="131" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><rect x="166" y="131" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><rect x="179" y="131" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><text x="150" y="162" font-size="12" fill="#62656b" font-weight="400" text-anchor="middle">Packed multimodal states</text><path d="M150 167v12" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="16" y="182" width="268" height="77" rx="3" fill="#fcf0ee" stroke="#ce352c" stroke-width="1.3"/><text x="150" y="206" font-size="16" fill="#ce352c" font-weight="600" text-anchor="middle">Shared backbone</text><text x="150" y="228" font-size="12" fill="#62656b" font-weight="400" text-anchor="middle">Interaction from the first block</text><text x="150" y="248" font-size="11.5" fill="#62656b" font-weight="400" text-anchor="middle">Joint state evolution through layers</text><path d="M150 259v16" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><text x="150" y="293" font-size="13" fill="#171717" font-weight="400" text-anchor="middle">Understanding / reasoning</text><text x="150" y="310" font-size="12" fill="#62656b" font-weight="400" text-anchor="middle">Generation when supported</text><path d="M8 326h284" fill="none" stroke="#c9ccd0" stroke-width="1.35"/><text x="150" y="340" font-size="10.5" fill="#62656b" font-weight="600" text-anchor="middle">TRAINING EVIDENCE</text><text x="150" y="357" font-size="11" fill="#ce352c" font-weight="400" text-anchor="middle">Early multimodal optimization of core weights</text>
  </g>
</svg>
