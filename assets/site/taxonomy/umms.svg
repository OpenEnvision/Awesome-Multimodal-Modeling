<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" fill="none">
  <title>UMMs: understanding and generation in a common modeling framework</title>
  <desc>Text and image inputs can use different tokenizers or visual encoders. A common autoregressive, diffusion, or hybrid modeling framework supports understanding and generation. Text decoding and a visual decoder or generator produce the outputs. Shared task organization does not require identical visual encoders or all parameters to be shared.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#62656b" stroke-width="1.3"/></marker>
    <marker id="red-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#ce352c" stroke-width="1.3"/></marker>
  </defs>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="68" y="20" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Text</text><text x="224" y="20" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Image</text><path d="M68 27v17" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M224 27v17" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="10" y="47" width="116" height="43" rx="3" fill="white" stroke="#c9ccd0" stroke-width="1.3"/><text x="68" y="72" font-size="12.5" fill="#171717" font-weight="400" text-anchor="middle">Text tokenizer</text><rect x="150" y="47" width="146" height="43" rx="3" fill="white" stroke="#171717" stroke-width="1.3"/><text x="223" y="65" font-size="13" fill="#171717" font-weight="400" text-anchor="middle">Visual encoding</text><text x="223" y="82" font-size="11" fill="#62656b" font-weight="400" text-anchor="middle">shared or task-specific</text><path d="M68 90v15" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M224 90v15" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="39" y="109" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="52" y="109" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="65" y="109" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="78" y="109" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="91" y="109" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="195" y="109" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><rect x="208" y="109" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><rect x="221" y="109" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><rect x="234" y="109" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><rect x="247" y="109" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><path d="M68 124v27" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M224 124v27" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="3" y="137" width="294" height="216" rx="3" fill="none" stroke="#c9ccd0" stroke-width="1.3" stroke-dasharray="4 4"/><rect x="16" y="154" width="268" height="61" rx="3" fill="#fcf0ee" stroke="#ce352c" stroke-width="1.3"/><text x="150" y="178" font-size="14" fill="#ce352c" font-weight="600" text-anchor="middle">Unified U + G modeling</text><text x="150" y="201" font-size="12.5" fill="#62656b" font-weight="400" text-anchor="middle">AR / diffusion / hybrid</text><path d="M68 215v13" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M224 215v13" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><text x="68" y="241" font-size="11.5" fill="#62656b" font-weight="400" text-anchor="middle">Text states</text><text x="224" y="241" font-size="11.5" fill="#62656b" font-weight="400" text-anchor="middle">Visual states</text><path d="M68 247v10" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M224 247v10" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="12" y="260" width="114" height="43" rx="3" fill="white" stroke="#171717" stroke-width="1.3"/><text x="69" y="286" font-size="12.5" fill="#171717" font-weight="400" text-anchor="middle">Text decoding</text><rect x="154" y="260" width="138" height="43" rx="3" fill="white" stroke="#171717" stroke-width="1.3"/><text x="223" y="278" font-size="12.5" fill="#171717" font-weight="400" text-anchor="middle">Visual decoder</text><text x="223" y="295" font-size="11.5" fill="#62656b" font-weight="400" text-anchor="middle">or generator</text><path d="M68 303v20" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M224 303v20" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><text x="68" y="343" font-size="13" fill="#171717" font-weight="400" text-anchor="middle">Text output</text><text x="224" y="343" font-size="13" fill="#171717" font-weight="400" text-anchor="middle">Image output</text>
  </g>
</svg>
