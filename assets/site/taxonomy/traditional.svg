<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" fill="none">
  <title>Traditional: alignment and fusion are different patterns</title>
  <desc>Two representative patterns. In CLIP-style alignment, separately encoded image and text embeddings are compared without a joint fusion backbone. In fusion models, modality features interact before task prediction. Neither pattern requires a pretrained generative LLM.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#62656b" stroke-width="1.3"/></marker>
    <marker id="red-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#ce352c" stroke-width="1.3"/></marker>
  </defs>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="8" y="13" font-size="11" fill="#62656b" font-weight="600" text-anchor="start">ALIGNMENT</text><text x="74" y="39" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Image</text><text x="226" y="39" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Text</text><path d="M74 45v13" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M226 45v13" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="14" y="61" width="120" height="33" rx="3" fill="white" stroke="#171717" stroke-width="1.3"/><rect x="166" y="61" width="120" height="33" rx="3" fill="white" stroke="#171717" stroke-width="1.3"/><text x="74" y="82" font-size="13" fill="#171717" font-weight="400" text-anchor="middle">Vision encoder</text><text x="226" y="82" font-size="13" fill="#171717" font-weight="400" text-anchor="middle">Text encoder</text><path d="M74 94v17" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M226 94v17" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="44" y="115" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="57" y="115" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="70" y="115" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="83" y="115" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="96" y="115" width="9" height="11" rx="1" fill="#c9ccd0" stroke="#62656b" stroke-width="1"/><rect x="196" y="115" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><rect x="209" y="115" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><rect x="222" y="115" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><rect x="235" y="115" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><rect x="248" y="115" width="9" height="11" rx="1" fill="white" stroke="#62656b" stroke-width="1"/><path d="M117 120h66" fill="none" stroke="#ce352c" stroke-width="1.35" marker-end="url(#red-arrow)" stroke-dasharray="4 3" marker-start="url(#red-arrow)"/><text x="150" y="146" font-size="12.5" fill="#ce352c" font-weight="400" text-anchor="middle">Compare embeddings</text><text x="150" y="164" font-size="11" fill="#62656b" font-weight="400" text-anchor="middle">e.g. CLIP-style contrastive alignment</text><path d="M8 180h284" fill="none" stroke="#c9ccd0" stroke-width="1.35"/><text x="8" y="202" font-size="11" fill="#62656b" font-weight="600" text-anchor="start">FUSION</text><text x="74" y="226" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Image</text><text x="226" y="226" font-size="14" fill="#171717" font-weight="400" text-anchor="middle">Text</text><path d="M74 232v22" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M226 232v22" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="14" y="257" width="120" height="31" rx="3" fill="white" stroke="#171717" stroke-width="1.3"/><rect x="166" y="257" width="120" height="31" rx="3" fill="white" stroke="#171717" stroke-width="1.3"/><text x="74" y="277" font-size="13" fill="#171717" font-weight="400" text-anchor="middle">Vision encoder</text><text x="226" y="277" font-size="13" fill="#171717" font-weight="400" text-anchor="middle">Text encoder</text><path d="M74 288v6h37v5" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><path d="M226 288v6h-37v5" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><rect x="42" y="302" width="216" height="29" rx="3" fill="#fcf0ee" stroke="#ce352c" stroke-width="1.3"/><text x="150" y="322" font-size="14" fill="#ce352c" font-weight="600" text-anchor="middle">Cross-modal fusion</text><path d="M150 331v12" fill="none" stroke="#62656b" stroke-width="1.35" marker-end="url(#arrow)"/><text x="150" y="358" font-size="13" fill="#171717" font-weight="400" text-anchor="middle">Task prediction</text>
  </g>
</svg>
